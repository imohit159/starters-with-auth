name: nextjs-custom-drizzle-postgres

on:
  push:
    branches: [main]
    paths:
      - "nextjs/custom/drizzle-postgres/**"
      - ".github/workflows/nextjs-custom-drizzle-postgres.yml"
  pull_request:
    paths:
      - "nextjs/custom/drizzle-postgres/**"
      - ".github/workflows/nextjs-custom-drizzle-postgres.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: nextjs/custom/drizzle-postgres

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: nextjs/custom/drizzle-postgres/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Types
        run: pnpm check-types

      # Testcontainers starts its own PostgreSQL; the runner already has Docker.
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/build_only
          APP_URL: https://localhost:3000
          ACCESS_TOKEN_SECRET: ci-access-token-secret-at-least-32-chars
          RATE_LIMIT_SECRET: ci-rate-limit-secret-at-least-32-chars
